spring.datasource.url=${GREENWOOD_DB_URL:jdbc:mysql://localhost:3306/SmartCampus?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${GREENWOOD_DB_USERNAME:root}
spring.datasource.password=${GREENWOOD_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false

# First-run administrator. Override these environment variables before production deployment.
greenwood.admin.username=${GREENWOOD_ADMIN_USERNAME:admin}
greenwood.admin.password=${GREENWOOD_ADMIN_PASSWORD:Greenwood@12345}
