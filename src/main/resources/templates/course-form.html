<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${schoolName} + ' • ' + pageTitle">Greenwood Eco School</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
<div th:replace="~{Navigation-bar :: nav}"></div>
<div class="main-wrap">
<header class="topbar">
<button class="btn btn-light menu-btn" id="menuBtn" type="button" aria-label="Open navigation">☰</button>
<div><strong th:text="${pageTitle}">Workspace</strong><div class="small text-muted" th:text="${pageSubtitle}">Manage school records</div></div>
<div class="d-flex align-items-center gap-2"><span class="badge-soft" sec:authentication="name">admin</span><a class="btn btn-sm btn-outline-secondary" href="/change-password">Account</a></div>
</header>
<main class="content">

<div class="page-heading"><div><div class="eyebrow text-brand">Academic workspace</div><h1>Add course</h1><p>Create a course with a unique code and valid credit units.</p></div><a class="btn btn-outline-secondary" href="/courses">Back to courses</a></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<section class="panel form-card"><div class="form-section-title"><h2>Course information</h2><span class="small text-muted">All fields are required</span></div><form th:action="@{/saveCourses}" th:object="${course}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><div class="field"><label>Course code *</label><input type="text" th:field="*{courseCode}" class="form-control" maxlength="20" required></div><div class="field"><label>Course name *</label><input type="text" th:field="*{courseName}" class="form-control" maxlength="100" required></div><div class="field"><label>Credit units *</label><input type="number" th:field="*{creditUnits}" class="form-control" min="1" max="99" required></div></div><div class="form-actions"><a class="btn btn-light" href="/courses">Cancel</a><button class="btn btn-brand" type="submit">Save course</button></div></form></section>
</main>
<div class="footer" th:text="${footerText}">Greenwood Eco School • Smart Campus</div>
</div></div>
<div id="overlay" class="mobile-overlay"></div>
<script>const s=document.getElementById('sidebar'),b=document.getElementById('menuBtn'),o=document.getElementById('overlay');if(b){b.onclick=()=>{s.classList.add('open');o.classList.add('show')}}if(o){o.onclick=()=>{s.classList.remove('open');o.classList.remove('show')}}</script>
</body></html>
