<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${schoolName} + ' • ' + pageTitle">Greenwood Eco School</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
<div th:replace="~{Navigation-bar :: nav}"></div>
<div class="main-wrap">
<header class="topbar">
<button class="btn btn-light menu-btn" id="menuBtn" type="button" aria-label="Open navigation">☰</button>
<div><strong th:text="${pageTitle}">Workspace</strong><div class="small text-muted" th:text="${pageSubtitle}">Manage school records</div></div>
<div class="d-flex align-items-center gap-2"><span class="badge-soft" sec:authentication="name">admin</span><a class="btn btn-sm btn-outline-secondary" href="/change-password">Account</a></div>
</header>
<main class="content">

<div class="page-heading"><div><div class="eyebrow text-brand">People & records</div><h1 th:text="${student.id == null ? 'Add student' : 'Edit student'}">Student</h1><p>Enter accurate student information. Student numbers must be unique.</p></div><a class="btn btn-outline-secondary" href="/students">Back to students</a></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<section class="panel form-card"><div class="form-section-title"><h2>Student information</h2><span class="small text-muted">Required fields are marked *</span></div>
<form th:action="@{/saveStudent}" th:object="${student}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="field"><label>Student number *</label><input type="text" th:field="*{studentNumber}" class="form-control" maxlength="20" required></div><div class="field"><label>Program *</label><input type="text" th:field="*{program}" class="form-control" maxlength="100" required></div><div class="field"><label>First name *</label><input type="text" th:field="*{firstName}" class="form-control" maxlength="50" required></div><div class="field"><label>Last name *</label><input type="text" th:field="*{lastName}" class="form-control" maxlength="50" required></div><div class="field"><label>Gender</label><select th:field="*{gender}" class="form-select"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option></select></div><div class="field"><label>Email</label><input type="email" th:field="*{email}" class="form-control" maxlength="100"></div><div class="field"><label>Phone number</label><input type="text" th:field="*{phoneNumber}" class="form-control" maxlength="15"></div></div><div class="form-actions"><a class="btn btn-light" href="/students">Cancel</a><button class="btn btn-brand" type="submit">Save student</button></div></form></section>
</main>
<div class="footer" th:text="${footerText}">Greenwood Eco School • Smart Campus</div>
</div></div>
<div id="overlay" class="mobile-overlay"></div>
<script>const s=document.getElementById('sidebar'),b=document.getElementById('menuBtn'),o=document.getElementById('overlay');if(b){b.onclick=()=>{s.classList.add('open');o.classList.add('show')}}if(o){o.onclick=()=>{s.classList.remove('open');o.classList.remove('show')}}</script>
</body></html>
